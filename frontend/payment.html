<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment</title>
  <link rel="stylesheet" href="css/bootstrap.css">
  <style>
    .item-row { border-bottom: 1px solid #e5e5e5; padding: 12px 0; }
    .item-img { width: 50px; height: 50px; object-fit: cover; }
  </style>
</head>
<body>

<div class="container" style="margin-top:50px;max-width:800px">
  <h2>Payment</h2>
  <p class="text-muted">Review your cart and choose an action.</p>

  <div id="itemsList"></div>

  <div class="text-right" style="margin-top:18px">
    <h4 id="totalAmount">Total: &#8377; 0</h4>
  </div>

  <div style="max-width:520px;margin:18px auto 0">
    <div class="form-group">
      <label>Full Name</label>
      <input id="checkoutName" class="form-control" placeholder="Full name">
    </div>
    <div class="form-group">
      <label>Shipping Address</label>
      <textarea id="checkoutAddress" class="form-control" placeholder="Shipping address"></textarea>
    </div>
  </div>

  <div style="max-width:420px;margin:18px auto;text-align:center">
    <div class="form-group">
      <label style="display:block;margin-bottom:6px;font-weight:600">Enter Mobile to Process Transaction</label>
      <input id="checkoutMobile" class="form-control" placeholder="Mobile number" style="max-width:320px;margin:0 auto;text-align:center;font-size:16px;padding:12px">
    </div>
  </div>

  <div style="max-width:420px;margin:6px auto 0;text-align:center">
    <label style="display:inline-block;margin-bottom:6px"><input type="checkbox" id="useFacePayment"> Use Face Authentication for payment (if enrolled)</label>
  </div>

  <div class="row" style="margin-top:24px">
    <div class="col-sm-6 col-sm-offset-3">
      <a id="proceedCheckout" class="btn btn-primary btn-block">Proceed to Checkout</a>
    </div>
  </div>

</div>

<div id="otpModal" style="display:none;position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;z-index:9999">
  <div style="background:#fff;padding:18px;border-radius:6px;width:320px;margin:0 auto">
    <h4 style="margin-top:0">Enter OTP</h4>
    <p style="font-size:13px;margin-bottom:6px">OTP sent to <strong id="otpSentTo"></strong></p>
    <p style="font-size:12px;color:#888;margin-top:0">Demo OTP: <strong id="demoOtpValue" style="letter-spacing:2px"></strong></p>
    <div class="form-group"><input id="otpInput" class="form-control" placeholder="6-digit OTP"></div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn btn-primary" onclick="verifyOtpAndPay()">Verify &amp; Pay</button>
      <button id="resendOtpBtn" class="btn btn-default" onclick="resendOtp()">Resend</button>
      <small id="resendTimer" style="margin-left:6px;color:#666"></small>
      <button class="btn btn-link pull-right" style="margin-left:auto" onclick="document.getElementById('otpModal').style.display='none'">Cancel</button>
    </div>
  </div>
</div>

<div id="paymentChoiceModal" style="display:none;position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;z-index:10001">
  <div style="background:#fff;padding:18px;border-radius:6px;width:360px;margin:0 auto;text-align:center">
    <h4 style="margin-top:0">Verify to Proceed</h4>
    <p style="font-size:13px;margin-bottom:8px">Choose how you'd like to verify your payment.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">
      <button id="useSavedMobileBtn" class="btn btn-primary">Use saved mobile</button>
      <button id="useFaceBtn" class="btn btn-default">Use Face</button>
      <button id="paymentChoiceCancel" class="btn btn-link">Cancel</button>
    </div>
  </div>
</div>

<div id="demoSpinner" style="display:none;position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;z-index:10000">
  <div style="display:flex;align-items:center;color:#fff">
    <div style="width:48px;height:48px;border-radius:50%;border:5px solid rgba(255,255,255,0.25);border-top-color:#fff;animation:spin 1s linear infinite;margin-right:12px"></div>
    <div class="spinner-text">Working...</div>
  </div>
</div>

<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script defer src="js/face-login.js"></script>

<script>
var productsJson = localStorage.getItem('cartProducts');
var products = [];
if (productsJson) {
  try { products = JSON.parse(productsJson); } catch (e) { products = []; }
}

var total = localStorage.getItem('cartTotal') || 0;
var itemsEl = document.getElementById('itemsList');

if (products.length === 0) {
  itemsEl.innerHTML = '<div class="alert alert-info">Your cart is empty.</div>';
} else {
  var html = '';
  products.forEach(function(p) {
    html += '<div class="item-row row">'
      + '<div class="col-xs-2"><img class="item-img" src="' + (p.image || 'images/si.jpg') + '" alt=""></div>'
      + '<div class="col-xs-6">' + (p.name || 'Product') + '<br><small class="text-muted">Qty: ' + (p.quantity || 1) + '</small></div>'
      + '<div class="col-xs-4 text-right">&#8377; ' + ((p.price || 0) * (p.quantity || 1)) + '</div>'
      + '</div>';
  });
  itemsEl.innerHTML = html;
}

document.getElementById('totalAmount').innerHTML = 'Total: &#8377; ' + total;

try {
  var currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
  var savedName = localStorage.getItem('checkoutName') || (currentUser && currentUser.name) || '';
  var savedAddress = localStorage.getItem('checkoutAddress') || '';
  var savedMobile = localStorage.getItem('checkoutMobile') || '';

  if (savedName) document.getElementById('checkoutName').value = savedName;
  if (savedAddress) document.getElementById('checkoutAddress').value = savedAddress;
  if (savedMobile) document.getElementById('checkoutMobile').value = savedMobile;
} catch (e) {}

var demoOtp = null;
var demoOtpExpiresAt = 0;

document.getElementById('proceedCheckout').addEventListener('click', function() {
  var mobile = (document.getElementById('checkoutMobile') || {}).value.trim() || '';
  var name = (document.getElementById('checkoutName') || {}).value.trim() || '';
  var address = (document.getElementById('checkoutAddress') || {}).value.trim() || '';
  var email = '';

  if (!name || !address || !mobile) {
    alert('Please enter full name, shipping address and mobile number to proceed.');
    return;
  }

  try {
    var cur = JSON.parse(localStorage.getItem('currentUser') || 'null');
    if (!cur) {
      localStorage.setItem('checkoutName', name);
      localStorage.setItem('checkoutAddress', address);
      localStorage.setItem('checkoutMobile', mobile);
      localStorage.setItem('returnTo', 'payment.html');
      window.location.href = 'login.html';
      return;
    }
    email = cur.email || '';
  } catch (e) {}

  window.__pendingOrder = {
    id: 'ORD' + Date.now(),
    date: new Date().toISOString(),
    status: 'Pending',
    products: JSON.parse(localStorage.getItem('cartProducts') || '[]'),
    total: total,
    shipping: { name: name, email: email, mobile: mobile, address: address }
  };

  var useFace = !!(document.getElementById('useFacePayment') && document.getElementById('useFacePayment').checked);
  if (useFace) {
    startFaceOrMobileChoice(mobile);
    return;
  }

  sendOtpToMobile(mobile);
});

function startFaceOrMobileChoice(mobile) {
  var cur = null;
  try { cur = JSON.parse(localStorage.getItem('currentUser') || 'null'); } catch (e) {}
  if (!cur) {
    alert('Please login/register first to use face payment.');
    return;
  }

  var choiceModal = document.getElementById('paymentChoiceModal');
  var savedMobile = localStorage.getItem('checkoutMobile') || mobile;
  var useSavedBtn = document.getElementById('useSavedMobileBtn');
  var useFaceBtn = document.getElementById('useFaceBtn');
  var cancelBtn = document.getElementById('paymentChoiceCancel');
  var faceOk = false;

  try { faceOk = !!(window.FaceLogin && FaceLogin.hasEnrolled && FaceLogin.hasEnrolled(cur.email)); } catch (e) {}

  useSavedBtn.innerText = savedMobile ? 'Use saved mobile (' + savedMobile + ')' : 'Use mobile from form';
  useFaceBtn.innerText = faceOk ? 'Use Face (registered)' : 'Use Face (not enrolled)';
  useFaceBtn.disabled = !faceOk;
  choiceModal.style.display = 'block';

  function cleanup() {
    choiceModal.style.display = 'none';
    useSavedBtn.removeEventListener('click', onSaved);
    useFaceBtn.removeEventListener('click', onFace);
    cancelBtn.removeEventListener('click', onCancel);
  }

  function onSaved() {
    cleanup();
    sendOtpToMobile(savedMobile || mobile);
  }

  function onFace() {
    cleanup();
    showSpinner('Verifying face...');
    FaceLogin.verify(cur.email).then(function(found) {
      hideSpinner();
      if (found) {
        finalizeOrder();
      } else {
        alert('Face verification failed. Falling back to OTP.');
        sendOtpToMobile(mobile);
      }
    }).catch(function() {
      hideSpinner();
      alert('Face verification cancelled or failed. Falling back to OTP.');
      sendOtpToMobile(mobile);
    });
  }

  function onCancel() {
    cleanup();
  }

  useSavedBtn.addEventListener('click', onSaved);
  useFaceBtn.addEventListener('click', onFace);
  cancelBtn.addEventListener('click', onCancel);
}

function sendOtpToMobile(mobile) {
  var apiBase = window.API_BASE || '';
  showSpinner('Sending OTP to ' + mobile + '...');

  fetch(apiBase + '/api/send-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mobile: mobile })
  })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      hideSpinner();
      if (json && json.ok) {
        demoOtp = json.demoOtp || null;
        demoOtpExpiresAt = Date.now() + (5 * 60 * 1000);
        document.getElementById('demoOtpValue').innerText = json.demoOtp || '';
        document.getElementById('otpSentTo').innerText = mobile;
        document.getElementById('otpModal').style.display = 'block';
        startOtpCountdown(30);
        return;
      }
      fallbackDemoOtp(mobile);
    })
    .catch(function() {
      hideSpinner();
      fallbackDemoOtp(mobile);
    });
}

function fallbackDemoOtp(mobile) {
  demoOtp = Math.floor(100000 + Math.random() * 900000).toString();
  demoOtpExpiresAt = Date.now() + (5 * 60 * 1000);
  document.getElementById('demoOtpValue').innerText = demoOtp;
  document.getElementById('otpSentTo').innerText = mobile;
  document.getElementById('otpModal').style.display = 'block';
  startOtpCountdown(30);
}

function startOtpCountdown(seconds) {
  var el = document.getElementById('resendTimer');
  var btn = document.getElementById('resendOtpBtn');
  if (!el || !btn) return;

  btn.disabled = true;
  el.innerText = seconds + 's';
  var timer = setInterval(function() {
    seconds--;
    el.innerText = seconds + 's';
    if (seconds <= 0) {
      clearInterval(timer);
      el.innerText = 'Expired';
      btn.disabled = false;
    }
  }, 1000);
}

function resendOtp() {
  var mobile = document.getElementById('otpSentTo').innerText || '';
  if (!mobile) return;
  sendOtpToMobile(mobile);
}

function verifyOtpAndPay() {
  var val = (document.getElementById('otpInput') || {}).value.trim();
  if (!val) {
    alert('Enter OTP');
    return;
  }

  var apiBase = window.API_BASE || '';
  showSpinner('Verifying OTP...');

  fetch(apiBase + '/api/verify-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      mobile: document.getElementById('otpSentTo').innerText,
      otp: val,
      order: window.__pendingOrder
    })
  })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      hideSpinner();
      if (json && json.ok) {
        finalizeOrder();
        return;
      }
      if (json && json.error) {
        alert('OTP verify failed: ' + json.error);
        return;
      }
      if (val === demoOtp && Date.now() <= demoOtpExpiresAt) {
        finalizeOrder();
        return;
      }
      alert('Incorrect OTP.');
    })
    .catch(function() {
      hideSpinner();
      if (val === demoOtp && Date.now() <= demoOtpExpiresAt) {
        finalizeOrder();
      } else {
        alert('OTP verification failed.');
      }
    });
}

function finalizeOrder() {
  document.getElementById('otpModal').style.display = 'none';
  showSpinner('Processing payment...');

  setTimeout(function() {
    hideSpinner();
    var order = window.__pendingOrder || null;
    if (!order) {
      alert('Order data missing.');
      return;
    }

    var orders = [];
    try { orders = JSON.parse(localStorage.getItem('orders') || '[]'); } catch (e) {}
    orders.unshift(order);
    localStorage.setItem('orders', JSON.stringify(orders));
    localStorage.setItem('latestOrder', JSON.stringify(order));

    localStorage.removeItem('cartProducts');
    localStorage.removeItem('cartTotal');
    localStorage.removeItem('products');

    var apiBase = window.API_BASE || '';
    fetch(apiBase + '/api/send-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        to: order.shipping.email,
        subject: 'Order ' + order.id + ' Confirmation',
        text: 'Thank you for your order. Order ID: ' + order.id + '\nTotal: ' + order.total
      })
    }).catch(function() {});

    window.location.href = 'success.html';
  }, 1200);
}

function showSpinner(text) {
  var s = document.getElementById('demoSpinner');
  if (!s) return;
  s.querySelector('.spinner-text').innerText = text || 'Working...';
  s.style.display = 'flex';
}

function hideSpinner() {
  var s = document.getElementById('demoSpinner');
  if (s) s.style.display = 'none';
}
</script>

<script src="js/order-utils.js"></script>
<script src="js/site-shell.js"></script>
</body>
</html>
