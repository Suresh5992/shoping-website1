<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Order History</title>
  <link rel="stylesheet" href="css/bootstrap.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #f8fafc; }
    .history-shell { margin-top: 40px; margin-bottom: 40px; max-width: 960px; }
    .history-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .history-actions a { margin-right: 10px; }
    .status-pill { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
    .status-pill.pending { background: #fef3c7; color: #92400e; }
    .status-pill.shipped { background: #dbeafe; color: #1d4ed8; }
    .status-pill.delivered { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>

<div class="container history-shell">
  <div class="history-top">
    <div>
      <h2>Order History</h2>
      <p class="text-muted">Track your past orders and current delivery stage.</p>
    </div>
    <div class="history-actions">
      <a href="index.html" class="btn btn-default">Continue Shopping</a>
      <a href="success.html" class="btn btn-primary">Latest Order</a>
    </div>
  </div>
  <div id="orders"></div>
</div>

<script>
function getStatusLabel(order) {
  var status = order && order.status ? order.status : '';
  if (status === 'Pending' || status === 'Shipped' || status === 'Delivered') return status;

  var dateValue = order && (order.date || order.created_at);
  var date = dateValue ? new Date(dateValue) : null;
  if (!date || isNaN(date.getTime())) return 'Pending';

  var ageDays = (Date.now() - date.getTime()) / (1000 * 60 * 60 * 24);
  if (ageDays >= 3) return 'Delivered';
  if (ageDays >= 1) return 'Shipped';
  return 'Pending';
}

function statusClass(status) {
  if (status === 'Delivered') return 'delivered';
  if (status === 'Shipped') return 'shipped';
  return 'pending';
}

function normalizeOrder(order) {
  var shipping = order.shipping || {};
  var normalized = {
    id: order.id || order.transaction_id || ('ORD' + Date.now()),
    date: order.date || order.created_at,
    total: order.total || order.amount || 0,
    products: order.products || [],
    shipping: {
      name: shipping.name || order.name || '',
      email: shipping.email || order.email || '',
      mobile: shipping.mobile || order.mobile || '',
      address: shipping.address || order.address || ''
    }
  };
  normalized.status = getStatusLabel(order);
  return normalized;
}

function readLocalOrders() {
  try {
    var localOrders = JSON.parse(localStorage.getItem('orders') || '[]');
    return Array.isArray(localOrders) ? localOrders.map(normalizeOrder) : [];
  } catch (e) {
    return [];
  }
}

function requireLogin() {
  var currentUser = null;
  try { currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null'); } catch (e) { currentUser = null; }
  if (!currentUser || !currentUser.email) {
    document.getElementById('orders').innerHTML = '<div class="alert alert-warning">Please <a href="login.html">login</a> or <a href="register.html">register</a> to view your order history.</div>';
    return false;
  }
  return true;
}

function renderOrders() {
  if (!requireLogin()) return;

  var out = document.getElementById('orders');
  out.innerHTML = '<div class="alert alert-info">Loading orders...</div>';

  var apiBase = window.API_BASE || '';
  fetch(apiBase + '/api/orders')
    .then(function(r) { return r.json(); })
    .then(function(json) {
      var currentUser = null;
      try { currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null'); } catch (e) {}
      var currentEmail = currentUser && currentUser.email ? String(currentUser.email).toLowerCase() : '';
      var apiOrders = json && json.ok && Array.isArray(json.orders) ? json.orders : [];
      var merged = {};

      apiOrders.map(normalizeOrder).concat(readLocalOrders()).forEach(function(order) {
        var orderEmail = String((order.shipping && order.shipping.email) || '').toLowerCase();
        if (currentEmail && orderEmail && orderEmail !== currentEmail) return;
        if (!merged[order.id]) merged[order.id] = order;
      });

      var orders = Object.keys(merged).map(function(key) { return merged[key]; });
      orders.sort(function(a, b) {
        return new Date(b.date || 0).getTime() - new Date(a.date || 0).getTime();
      });

      if (!orders.length) {
        out.innerHTML = '<div class="alert alert-info">No orders found.</div>';
        return;
      }

      var html = '';
      orders.forEach(function(o) {
        var readableDate = o.date ? new Date(o.date).toLocaleString() : 'Just now';
        html += '<div class="panel panel-default" style="margin-top:12px">';
        html += '<div class="panel-heading"><strong>Order ' + o.id + '</strong> <span class="pull-right">' + readableDate + '</span></div>';
        html += '<div class="panel-body">';
        html += '<p><strong>Status:</strong> <span class="status-pill ' + statusClass(o.status) + '">' + o.status + '</span></p>';
        html += '<p><strong>Total:</strong> &#8377; ' + o.total + '</p>';
        html += '<p><strong>Shipping:</strong> ' + (o.shipping.name || '') + ' &nbsp; ' + (o.shipping.mobile || '') + '<br>' + (o.shipping.address || '') + '</p>';
        html += '<table class="table table-condensed"><thead><tr><th>Product</th><th>Qty</th><th class="text-right">Price</th></tr></thead><tbody>';
        (o.products || []).forEach(function(p) {
          html += '<tr><td>' + (p.name || '') + '</td><td>' + (p.quantity || 1) + '</td><td class="text-right">&#8377; ' + ((p.price || 0) * (p.quantity || 1)) + '</td></tr>';
        });
        html += '</tbody></table>';
        html += '</div></div>';
      });
      out.innerHTML = html;
    })
    .catch(function(err) {
      console.error('Fetch orders error:', err);
      var currentUser = null;
      try { currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null'); } catch (e) {}
      var currentEmail = currentUser && currentUser.email ? String(currentUser.email).toLowerCase() : '';
      var localOrders = readLocalOrders().filter(function(order) {
        var email = String((order.shipping && order.shipping.email) || '').toLowerCase();
        return !currentEmail || !email || email === currentEmail;
      });
      if (!localOrders.length) {
        out.innerHTML = '<div class="alert alert-danger">Error loading orders. Please try again.</div>';
        return;
      }

      var html = '<div class="alert alert-warning">Showing saved local order history while the server is unavailable.</div>';
      localOrders.forEach(function(o) {
        html += '<div class="panel panel-default" style="margin-top:12px">';
        html += '<div class="panel-heading"><strong>Order ' + o.id + '</strong> <span class="pull-right">' + (o.date ? new Date(o.date).toLocaleString() : 'Just now') + '</span></div>';
        html += '<div class="panel-body">';
        html += '<p><strong>Status:</strong> <span class="status-pill ' + statusClass(o.status) + '">' + o.status + '</span></p>';
        html += '<p><strong>Total:</strong> &#8377; ' + o.total + '</p>';
        html += '<p><strong>Shipping:</strong> ' + (o.shipping.name || '') + ' &nbsp; ' + (o.shipping.mobile || '') + '<br>' + (o.shipping.address || '') + '</p>';
        html += '</div></div>';
      });
      out.innerHTML = html;
    });
}

renderOrders();
</script>

<script src="js/order-utils.js"></script>
<script src="js/site-shell.js"></script>
</body>
</html>
